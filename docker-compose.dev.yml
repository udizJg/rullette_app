services:
  ruleta-app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruleta-app-dev
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      PORT: 3000
      DATA_DIR: ./data-dev
    ports:
      - "3001:3000"
    volumes:
      - ./data-dev:/app/data-dev
