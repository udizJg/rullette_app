<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ruleta NIU25</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@700;800;900&display=swap"
      rel="stylesheet" />
    <link rel="preload" href="/assets/niu25.svg" as="fetch" type="image/svg+xml" crossorigin="anonymous" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="ruleta7">
    <div class="stage-light stage-light--left" aria-hidden="true">
      <span class="stage-light__beam"></span>
      <span class="stage-light__head"></span>
    </div>
    <div class="stage-light stage-light--right" aria-hidden="true">
      <span class="stage-light__beam"></span>
      <span class="stage-light__head"></span>
    </div>
    <!-- Piso iluminado: elipse aplanada donde “caen” los haces. -->
    <div class="stage-floor" aria-hidden="true">
      <span class="stage-floor__pool"></span>
      <span class="stage-floor__spill stage-floor__spill--left"></span>
      <span class="stage-floor__spill stage-floor__spill--right"></span>
    </div>
    <div class="confetti-root" id="confettiRoot" aria-hidden="true"></div>
    <main class="app">
      <header class="header">
        <p class="subtitle" id="statusLine">Cargando…</p>
      </header>

      <section class="wheel-stage" aria-live="polite">
        <div class="wheel-frame">
          <!-- Un solo puntero amarillo: sin cover rojo para evitar el efecto doble. -->
          <div class="pointer" aria-hidden="true"></div>
          <div class="wheel-impact-halo" id="wheelImpactHalo" aria-hidden="true"></div>
          <div class="wheel-rim">
            <div class="wheel-spin wheel-spin--loading" id="wheelSpin" aria-busy="true">
              <!-- SVG incrustado por app7.js -->
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <button type="button" class="spin-btn spin-btn--red" id="spinBtn" disabled>
          <span class="spin-btn__label">Girar</span>
        </button>
        <p class="result" id="resultMsg"></p>
      </section>
    </main>
    <script src="/app7.js" type="module"></script>
  </body>
</html>
